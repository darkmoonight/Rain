name: rain
description: Weather application

publish_to: "none"

version: 1.3.20+53

environment:
  sdk: ">=3.13.5 <4.0.0"
  flutter: "^3.47.7"

dependencies:
  # Flutter SDK
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0

  # Networking & HTTP caching
  dio: ^5.11.1
  dio_cache_interceptor: ^4.0.7
  http_cache_file_store: ^2.0.2
  internet_connection_checker_plus: ^3.1.2
  connectivity_plus: ^7.3.1

  # Local storage
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1
  path_provider: ^2.1.6

  # API models (codegen runtime)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Localization & formatting
  intl: ^0.20.3
  slang: ^4.19.2
  slang_flutter: ^4.19.0

  # Location, coordinates & timezone
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  latlong2: ^0.9.1
  lat_lng_to_timezone: ^0.2.0
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # Maps
  flutter_map: ^8.3.2
  flutter_map_cache: ^2.1.0
  flutter_map_animations: ^0.10.0

  # Android widgets & background work
  home_widget: ^0.10.0
  workmanager: ^0.10.10

  # Notifications
  flutter_local_notifications: ^22.3.2

  # UI & theming
  gap: ^3.0.1
  shimmer: ^4.0.0
  google_fonts: ^9.0.0
  dynamic_system_colors: ^1.9.0
  material_color_utilities: ^0.13.0
  iconsax_plus: ^1.0.0
  line_awesome_flutter: ^3.0.1
  reorderables: ^0.6.0
  scrollable_positioned_list: ^0.3.8
  flutter_expandable_fab: ^3.0.0
  flutter_hsvcolor_picker: ^1.5.1
  material_ui: ^1.7.0

  # Platform & utilities
  url_launcher: ^6.3.3
  restart_app: ^1.10.2
  display_mode: ^0.0.2
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2

dev_dependencies:
  # Testing
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.16.2
  freezed: ^4.0.3
  json_serializable: ^6.14.1
  isar_community_generator: ^3.4.1

  # Linting
  flutter_lints: ^6.0.0

  # App assets (splash & launcher icons)
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#181818"
  adaptive_icon_foreground: "assets/icons/icon.png"

flutter_native_splash:
  color: "#181818"
  android_12:
    color: "#181818"
  image: "assets/icons/icon.png"

flutter:
  default-flavor: gms
  generate: false
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/weather_icons/classic/
